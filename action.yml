name: LockCone
description: Explain pnpm dependency changes using manifest roots and dependency paths.
inputs:
  base:
    description: Base commit available in the checked-out repository
    required: true
  head:
    description: Head commit available in the checked-out repository
    default: HEAD
  repository:
    description: Path to the checked-out repository to analyze
    default: .
outputs:
  report:
    description: Path to the JSON report
    value: ${{ steps.analyze.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Locate LockCone manifest
      id: paths
      shell: bash
      env:
        LOCKCONE_ACTION: ${{ github.action_path }}
      run: |
        node -e 'const p = require("node:path"); console.log("manifest=" + p.relative(process.env.GITHUB_WORKSPACE, p.join(process.env.LOCKCONE_ACTION, "package.json")))' >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@v4
      with:
        version: 12.5.1
        package_json_file: ${{ steps.paths.outputs.manifest }}
        run_install: false
    - name: Build LockCone
      shell: bash
      env:
        LOCKCONE_ACTION: ${{ github.action_path }}
      run: |
        pnpm --dir "$LOCKCONE_ACTION" install --frozen-lockfile --prod=false
        pnpm --dir "$LOCKCONE_ACTION" build
    - name: Analyze dependency changes
      id: analyze
      shell: bash
      env:
        LOCKCONE_ACTION: ${{ github.action_path }}
        LOCKCONE_BASE: ${{ inputs.base }}
        LOCKCONE_HEAD: ${{ inputs.head }}
        LOCKCONE_REPOSITORY: ${{ inputs.repository }}
      run: |
        report=$(mktemp "$RUNNER_TEMP/lockcone-XXXXXX.json")
        node "$LOCKCONE_ACTION/dist/cli/index.js" diff \
          --cwd "$LOCKCONE_REPOSITORY" \
          --base "$LOCKCONE_BASE" --head "$LOCKCONE_HEAD" \
          --format json > "$report"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        cat "$report"
