name: LockCone
description: Explain pnpm dependency changes using manifest roots and dependency paths.
inputs:
  base:
    description: Base commit available in the checked-out repository
    required: true
  head:
    description: Head commit available in the checked-out repository
    default: HEAD
  repository:
    description: Path to the checked-out repository to analyze
    default: .
outputs:
  report:
    description: Path to the JSON report
    value: ${{ steps.analyze.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - uses: pnpm/setup@v2
      with:
        version: 12.5.1
        install: false
    - name: Build LockCone
      shell: bash
      env:
        LOCKCONE_ACTION: ${{ github.action_path }}
      run: |
        pnpm --dir "$LOCKCONE_ACTION" install --frozen-lockfile --prod=false
        pnpm --dir "$LOCKCONE_ACTION" build
    - name: Analyze dependency changes
      id: analyze
      shell: bash
      env:
        LOCKCONE_ACTION: ${{ github.action_path }}
        LOCKCONE_BASE: ${{ inputs.base }}
        LOCKCONE_HEAD: ${{ inputs.head }}
        LOCKCONE_REPOSITORY: ${{ inputs.repository }}
      run: |
        report_dir=$(mktemp -d "$RUNNER_TEMP/lockcone.XXXXXX")
        report="$report_dir/report.json"
        node "$LOCKCONE_ACTION/dist/cli/index.js" diff \
          --cwd "$LOCKCONE_REPOSITORY" \
          --base "$LOCKCONE_BASE" --head "$LOCKCONE_HEAD" \
          --format json > "$report"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        cat "$report"
