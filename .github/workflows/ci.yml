name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/setup@v2
        with:
          version: 12.5.1
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm demo
      - name: Resolve action test refs
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            if ! base="$(git rev-parse --verify HEAD^ 2>/dev/null)"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            head="$(git rev-parse --verify HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Run the composite action
        if: steps.refs.outputs.skip != 'true'
        id: lockcone
        uses: ./
        with:
          base: ${{ steps.refs.outputs.base }}
          head: ${{ steps.refs.outputs.head }}
      - name: Validate the action report
        if: steps.lockcone.conclusion == 'success'
        env:
          LOCKCONE_REPORT: ${{ steps.lockcone.outputs.report }}
          LOCKCONE_BASE: ${{ steps.refs.outputs.base }}
          LOCKCONE_HEAD: ${{ steps.refs.outputs.head }}
        run: node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.env.LOCKCONE_REPORT, "utf8")); if (report.schemaVersion !== 3 || report.base !== process.env.LOCKCONE_BASE || report.head !== process.env.LOCKCONE_HEAD) process.exit(1);'
  action-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve action test refs
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            if ! base="$(git rev-parse --verify HEAD^ 2>/dev/null)"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            head="$(git rev-parse --verify HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Run the composite action twice
        if: steps.refs.outputs.skip != 'true'
        id: first
        uses: ./
        with:
          base: ${{ steps.refs.outputs.base }}
          head: ${{ steps.refs.outputs.head }}
      - if: steps.refs.outputs.skip != 'true'
        uses: ./
        id: second
        with:
          base: ${{ steps.refs.outputs.base }}
          head: ${{ steps.refs.outputs.head }}
      - name: Validate both reports use distinct temporary paths
        if: steps.first.conclusion == 'success' && steps.second.conclusion == 'success'
        env:
          REPORT_ONE: ${{ steps.first.outputs.report }}
          REPORT_TWO: ${{ steps.second.outputs.report }}
          LOCKCONE_BASE: ${{ steps.refs.outputs.base }}
          LOCKCONE_HEAD: ${{ steps.refs.outputs.head }}
        run: |
          test "$REPORT_ONE" != "$REPORT_TWO"
          node -e 'const fs = require("node:fs"); for (const path of [process.env.REPORT_ONE, process.env.REPORT_TWO]) { const report = JSON.parse(fs.readFileSync(path, "utf8")); if (report.schemaVersion !== 3 || report.base !== process.env.LOCKCONE_BASE || report.head !== process.env.LOCKCONE_HEAD) process.exit(1); }'
